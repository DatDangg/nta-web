name: Deploy (VPS)

# Chạy trên self-hosted GitHub Actions runner đã gắn với repo này (label: nta-web).
# Trigger: push lên main, hoặc chạy tay (workflow_dispatch).
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-nta-web
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://landing.ntasolution.vn
  HOST_PORT: "3005"
  CONTACT_FORM_TARGET: ${{ secrets.CONTACT_FORM_TARGET }}

jobs:
  deploy:
    runs-on: [self-hosted, nta-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Deploy (recreate)
        run: docker compose up -d --remove-orphans

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://127.0.0.1:${HOST_PORT}/api/health"; then
              echo "health OK"
              exit 0
            fi
            sleep 3
          done
          echo "health check FAILED"
          docker compose logs --tail=80
          exit 1
