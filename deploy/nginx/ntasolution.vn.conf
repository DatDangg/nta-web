# nginx vhost — ntasolution.vn  →  reverse proxy tới app (127.0.0.1:3005)
#
# Cài trên VPS (shared server đang có nginx + certbot):
#   1. cp deploy/nginx/ntasolution.vn.conf /etc/nginx/sites-available/ntasolution.vn
#   2. ln -s /etc/nginx/sites-available/ntasolution.vn /etc/nginx/sites-enabled/
#   3. certbot --nginx -d ntasolution.vn -d www.ntasolution.vn   (chỉ sau khi DNS trỏ đúng)
#   4. nginx -t && systemctl reload nginx
#
# LƯU Ý: block 443 dưới đây cần cert tồn tại (certbot sinh). Trước khi có cert,
# chỉ dùng block 80 để proxy (hoặc để certbot tự thêm block 443 qua --nginx).

server {
    listen 80;
    listen [::]:80;
    server_name ntasolution.vn www.ntasolution.vn;

    # ACME challenge cho certbot (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

