# nginx vhost — ntasolution.vn (+ www)  →  reverse proxy tới app (127.0.0.1:3005)
#
# Domain PHỤ (secondary entry point): cùng app, cùng nội dung với ntavietnam.tech.
# canonical/SEO VẪN là https://ntavietnam.tech (`NEXT_PUBLIC_SITE_URL` không đổi) → 2 domain
# KHÔNG redirect lẫn nhau; chỉ:
#   - `www.ntasolution.vn` → 301 apex `ntasolution.vn` (tránh 3 hostname trùng nội dung)
#   - `http://` → 301 `https://` (certbot --nginx tự thêm block 443 + redirect)
#
# Cài trên VPS (shared server đang có nginx + certbot) — xem docs/runbook/deploy-vps.md §3b:
#   1. cp deploy/nginx/ntasolution.vn.conf /etc/nginx/sites-available/ntasolution.vn
#   2. ln -sf /etc/nginx/sites-available/ntasolution.vn /etc/nginx/sites-enabled/
#   3. certbot --nginx --redirect -d ntasolution.vn -d www.ntasolution.vn   (chỉ sau khi DNS trỏ đúng)
#   4. nginx -t && systemctl reload nginx
#
# LƯU Ý: `certbot --nginx` nhận cả 2 server block dưới đây (cùng 1 cert Let's Encrypt
# apex+www), tự thêm `listen 443 ssl` + ssl_certificate vào từng block.
# Block www giữ `return 301 https://ntasolution.vn$request_uri` ⇒ https://www.ntasolution.vn → 301 apex.
# Trước khi có cert, chỉ block 80 hoạt động (http:// apex proxy trực tiếp; http://www → 301 https apex).

# ── www → apex (301) ────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.ntasolution.vn;

    # ACME challenge cho certbot (www phải trả được challenge qua HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ntasolution.vn$request_uri;
    }
}

# ── apex → proxy tới app (cùng app/port với ntavietnam.tech) ────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ntasolution.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
