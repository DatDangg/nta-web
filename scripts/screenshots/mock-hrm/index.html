<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440" />
  <title>NTA HRM · Quản trị nhân sự</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">MQ</div>
        <div>
          <div class="brand-name">Minh Quang HRM</div>
          <div class="brand-sub">Quản trị nhân sự</div>
        </div>
      </div>

      <div>
        <div class="nav-group-label">Nhân sự</div>
        <ul class="nav" id="nav-main"></ul>
      </div>

      <div>
        <div class="nav-group-label">Tổ chức &amp; quy trình</div>
        <ul class="nav" id="nav-more"></ul>
      </div>

      <div class="sidebar-foot">
        <div class="user-avatar" id="me-avatar">NH</div>
        <div>
          <div class="user-name" id="me-name">—</div>
          <div class="user-role" id="me-role">—</div>
        </div>
        <span class="logout-link" title="Đăng xuất">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="branch-select">
          Văn phòng Hà Nội
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </span>
        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Tìm nhân sự, mã nhân viên, số điện thoại…</span>
        </div>
        <div class="topbar-right">
          <span class="icon-btn" title="Thông báo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="dot"></span>
          </span>
          <span class="icon-btn" title="Trợ giúp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 1 1 4.4 2.7c-.9.5-1.5 1.1-1.5 2.1"/><path d="M12 17h.01"/></svg>
          </span>
          <span class="topbar-avatar" id="top-avatar">NH</span>
        </div>
      </header>

      <main class="content" id="stage"></main>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
