<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>wrapper</title>
  <style>
    /* Khung cửa sổ macOS — thông số đo từ ảnh cũ (scripts/screenshots/design-tokens.md).
       1328 (nội dung) → ảnh ra 2656 px @dsf 2.

       NỀN NGOÀI PHẢI TRONG SUỐT, KHÔNG padding, KHÔNG nền xám.
       Lý do: ảnh trước đây có `padding: 56px` + `background: #eef1f5` → bị "nướng" sẵn
       một hộp xám vuông quanh cửa sổ. Trên web, hộp xám đó hiện thành viền nền thừa
       quanh ảnh, còn HRM lại được component bo góc + shadow → hai kiểu trông lệch nhau.
       Giờ ảnh chỉ còn đúng cửa sổ macOS, bo góc bo tròn sẵn ở 4 góc cửa sổ; viền và bóng
       đổ do component thêm, nhất quán cho mọi ảnh.
       `Emulation.setDefaultBackgroundColorOverride` trong capture.mjs ép alpha = 0 để
       `Page.captureScreenshot` xuất PNG có kênh alpha. */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .window {
      width: 1328px;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      /* Viền 1px kẹp trong, KHÔNG đổi bề rộng. Box-shadow tròn theo bo góc nên 4 góc
         ngoài bo góc vẫn trong suốt — đúng hình dạng cửa sổ macOS. */
      box-shadow: 0 0 0 1px #e0e1e6;
    }
    .titlebar {
      position: relative;
      height: 51px;
      background: #f5f5f7;
      border-bottom: 1px solid #e3e3e7;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dots { position: absolute; left: 28px; top: 20px; display: flex; gap: 11px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }
    .dots i:nth-child(1) { background: #fd807a; }
    .dots i:nth-child(2) { background: #fec13f; }
    .dots i:nth-child(3) { background: #39cc4f; }
    .title { font-size: 17px; font-weight: 500; color: #6e6e73; }
    img.shot { display: block; width: 1328px; height: auto; background: #fff; }
    /* khi đang chờ ảnh: giữ chiều cao ước lượng để trang không nhảy */
    .holder { width: 1328px; background: #fff; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="title" id="title">—</span>
    </div>
    <img class="shot" id="shot" alt="" />
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("title").textContent = q.get("title") || "";
    const img = document.getElementById("shot");
    img.src = q.get("src") || "";
    const done = () => { window.__READY__ = true; };
    if (img.complete && img.naturalWidth) done();
    else { img.addEventListener("load", done); img.addEventListener("error", done); }
  </script>
</body>
</html>
